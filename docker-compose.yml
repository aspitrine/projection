name: projection

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/projection
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: projection-postgres
    environment:
      POSTGRES_DB: projection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - projection_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: projection-garage
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - projection_garage_meta:/var/lib/garage/meta
      - projection_garage_data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  projection_postgres_data:
  projection_garage_meta:
  projection_garage_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
